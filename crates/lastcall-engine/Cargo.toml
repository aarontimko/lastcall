[package]
name = "lastcall-engine"
description = "lastcall review engine: config, herdr client, and (from Phase 2) the review ledger. No terminal code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["herdr"]
# The herdr client is optional by construction: nothing in the review engine depends on it
# (docs/spec/00-spec.md §6.6). `cargo check -p lastcall-engine --no-default-features` proves it.
herdr = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
notify.workspace = true
# Deliverable 1's write path: `O_NOFOLLOW` from `nix::fcntl::OFlag` and the dead-pid probe
# from `nix::sys::signal::kill`. Safe wrappers only — direct `libc` is forbidden
# workspace-wide (AGENTS.md; `just lint` greps for it).
nix = { workspace = true, features = ["fs", "signal"] }
similar = "3.2.0"
globset = "0.4.20"
sha2 = "0.11.0"

[dev-dependencies]
lastcall-testkit.workspace = true
proptest = "1.11.0"
tokio = { workspace = true, features = ["test-util"] }
# Test-only, and deliberately so: the engine emits `tracing` events and never installs a
# subscriber. Deliverable 8's probe test collects them with a thread-scoped one.
tracing-subscriber.workspace = true

[lints]
workspace = true
