[package]
name = "lastcall"
description = "The last call before code ships: an agent-agnostic review ledger for the terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lastcall"
path = "src/main.rs"

[dependencies]
lastcall-engine.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ratatui.workspace = true
crossterm.workspace = true
unicode-width = "0.2"

[dev-dependencies]
insta = "1.48"
proptest = "1.11.0"
lastcall-testkit.workspace = true
# `test-util` for `tokio::time::pause()`: the toast timing tests advance a virtual clock
# instead of sleeping (unit tier: no sleep over 50 ms).
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
