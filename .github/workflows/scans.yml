# Supply-chain and code scanning: on every pull request, on a Monday schedule, and on demand.
# CodeQL "default setup" stays off in Settings > Code security; it conflicts with the
# advanced setup below (docs/dev/publishing.md, step 5).
name: scans

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Advisories, licences and bans against deny.toml. Same three checks as `just audit`.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories licenses bans

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the toolchain pin
        id: pin
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  # Fails a pull request that introduces a dependency with a known advisory, judged on the
  # diff of the lockfile rather than the whole tree (cargo-deny above covers that). It only
  # has a diff to read on pull_request, and GitHub only serves it on a public repository.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
