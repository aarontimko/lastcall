[workspace]
resolver = "3"
members = [
    "crates/lastcall-engine",
    "crates/lastcall",
    "crates/lastcall-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aarontimko/lastcall"
rust-version = "1.98.0"

[workspace.dependencies]
lastcall-engine = { path = "crates/lastcall-engine" }
lastcall-testkit = { path = "crates/lastcall-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "signal",
] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
notify = "8"
portable-pty = "0.9"
nix = { version = "0.31", features = ["signal", "process"] }

[workspace.lints.rust]
# Safe wrappers only: portable_pty::Child for the owned PTY child, nix::sys::signal::kill
# for the PID registry. Never `libc` directly (docs/spec/90-phase1-kickoff.md, deliverable 1).
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = "debuginfo"
